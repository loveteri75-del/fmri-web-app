<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMC fMRI 핑거탭 예습 시스템</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3/drawing_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js"></script>

  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #0f172a, #020617);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .app-wrapper {
      max-width: 600px;
      margin: auto;
      padding: 16px;
    }

    h2 {
      color: #00f0ff;
      font-size: 22px;
    }

    #video-container {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: black;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    video,
    canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: rotateY(180deg);
    }

    #dashboard {
      background: rgba(30, 41, 59, 0.8);
      border-radius: 16px;
      padding: 16px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 10px;
      border: none;
      margin-bottom: 12px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: none;
      font-size: 16px;
      font-weight: bold;
      background: linear-gradient(90deg, #00f0ff, #0072ff);
      color: #020617;
      margin-bottom: 12px;
    }

    button:disabled {
      background: #334155;
      color: #94a3b8;
    }

    #timer-box {
      padding: 14px;
      border-radius: 12px;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
      background: rgba(148, 163, 184, 0.15);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .card {
      background: rgba(15, 23, 42, 0.7);
      padding: 12px;
      border-radius: 10px;
    }

    .label {
      font-size: 12px;
      color: #94a3b8;
    }

    .value {
      font-size: 20px;
      font-weight: bold;
    }

    #status {
      margin-top: 14px;
      min-height: 45px;
      font-size: 15px;
      color: #10b981;
      white-space: pre-line;
    }
  </style>
</head>

<body>
  <div class="app-wrapper">
    <h2>fMRI 핑거탭 사전 학습 시스템</h2>

    <div id="video-container">
      <video class="input_video" autoplay muted playsinline></video>
      <canvas class="output_canvas" width="640" height="480"></canvas>
    </div>

    <div id="dashboard">
      <input id="patient-id" value="Patient_001" placeholder="환자 ID 입력" />

      <button id="start-btn" disabled>AI 모델 로딩 중...</button>

      <div id="timer-box">대기 중</div>

      <div class="grid">
        <div class="card">
          <div class="label">남은 시간</div>
          <div class="value"><span id="time-left">10</span>초</div>
        </div>

        <div class="card">
          <div class="label">라운드</div>
          <div class="value"><span id="round-count">0</span> / 3</div>
        </div>

        <div class="card">
          <div class="label">성공</div>
          <div class="value" style="color:#10b981;">
            <span id="success-count">0</span>회
          </div>
        </div>

        <div class="card">
          <div class="label">오류</div>
          <div class="value" style="color:#ef4444;">
            <span id="error-count">0</span>회
          </div>
        </div>
      </div>
    </div>

    <div id="status">카메라 권한을 허용해 주세요.</div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const videoElement = document.querySelector(".input_video");
      const canvasElement = document.querySelector(".output_canvas");
      const canvasCtx = canvasElement.getContext("2d");

      const startBtn = document.getElementById("start-btn");
      const statusBox = document.getElementById("status");

      let fMRIMode = "READY";
      let timeLeft = 10;
      let totalRounds = 0;
      let totalSuccess = 0;
      let totalErrors = 0;
      let currentSeqIndex = 0;
      let timerInterval = null;
      let isCooldown = false;
      let cameraReady = false;

      const TARGET_SEQUENCE = [8, 12, 16, 20];
      const FINGER_NAMES = {
        8: "검지",
        12: "중지",
        16: "약지",
        20: "소지"
      };

      function speak(text) {
        if (!("speechSynthesis" in window)) return;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "ko-KR";
        u.rate = 0.9;
        speechSynthesis.speak(u);
      }

      function updateDashboard() {
        document.getElementById("success-count").innerText = totalSuccess;
        document.getElementById("error-count").innerText = totalErrors;
        document.getElementById("round-count").innerText = totalRounds;
      }

      function switchMode(mode) {
        fMRIMode = mode;

        if (mode === "REST") {
          timeLeft = 10;
          document.getElementById("timer-box").innerText = "휴식기 REST";
          statusBox.innerText = "손을 움직이지 말고 화면 중앙을 보세요.";
          statusBox.style.color = "#f59e0b";
        }

        if (mode === "ACTIVE") {
          timeLeft = 30;
          currentSeqIndex = 0;
          document.getElementById("timer-box").innerText = "자극기 ACTIVE";
          statusBox.innerText = "검지 → 중지 → 약지 → 소지 순서로 엄지와 터치하세요.";
          statusBox.style.color = "#10b981";
          speak("검지 중지 약지 소지 순서로 손가락을 움직여 주세요.");
        }

        document.getElementById("time-left").innerText = timeLeft;
      }

      function startTask() {
        if (!cameraReady) {
          statusBox.innerText = "카메라가 아직 준비되지 않았습니다.";
          statusBox.style.color = "#ef4444";
          return;
        }

        clearInterval(timerInterval);

        totalSuccess = 0;
        totalErrors = 0;
        totalRounds = 0;
        currentSeqIndex = 0;
        updateDashboard();

        switchMode("REST");

        timerInterval = setInterval(() => {
          timeLeft--;
          document.getElementById("time-left").innerText = timeLeft;

          if (timeLeft <= 0) {
            if (fMRIMode === "REST") {
              switchMode("ACTIVE");
            } else if (fMRIMode === "ACTIVE") {
              totalRounds++;
              updateDashboard();

              if (totalRounds >= 3) {
                clearInterval(timerInterval);
                fMRIMode = "DONE";
                document.getElementById("timer-box").innerText = "연습 완료";
                statusBox.innerText = "연습이 완료되었습니다.";
                statusBox.style.color = "#00f0ff";
                speak("연습이 완료되었습니다. 수고하셨습니다.");
                startBtn.innerText = "다시 시작";
              } else {
                switchMode("REST");
              }
            }
          }
        }, 1000);

        startBtn.innerText = "진행 중 / 다시 시작";
      }

      startBtn.addEventListener("click", startTask);

      function onResults(results) {
        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

        if (fMRIMode === "REST") {
          canvasCtx.strokeStyle = "white";
          canvasCtx.lineWidth = 5;
          canvasCtx.beginPath();
          canvasCtx.moveTo(300, 240);
          canvasCtx.lineTo(340, 240);
          canvasCtx.stroke();
          canvasCtx.beginPath();
          canvasCtx.moveTo(320, 220);
          canvasCtx.lineTo(320, 260);
          canvasCtx.stroke();
        }

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
          statusBox.innerText =
            fMRIMode === "READY"
              ? "손 인식 완료. 시작 버튼을 눌러주세요."
              : statusBox.innerText;

          for (const landmarks of results.multiHandLandmarks) {
            drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {
              color: "#00f0ff",
              lineWidth: 3
            });

            drawLandmarks(canvasCtx, landmarks, {
              color: "#ef4444",
              lineWidth: 1,
              radius: 4
            });

            if (fMRIMode === "ACTIVE") {
              const thumb = landmarks[4];
              const targetTipIndex = TARGET_SEQUENCE[currentSeqIndex];
              const targetFinger = landmarks[targetTipIndex];

              canvasCtx.beginPath();
              canvasCtx.arc(
                targetFinger.x * canvasElement.width,
                targetFinger.y * canvasElement.height,
                24,
                0,
                Math.PI * 2
              );
              canvasCtx.strokeStyle = "#00f0ff";
              canvasCtx.lineWidth = 5;
              canvasCtx.stroke();

              const dist = Math.hypot(
                thumb.x - targetFinger.x,
                thumb.y - targetFinger.y
              );

              if (dist < 0.055 && !isCooldown) {
                isCooldown = true;
                totalSuccess++;
                currentSeqIndex =
                  (currentSeqIndex + 1) % TARGET_SEQUENCE.length;

                statusBox.innerText =
                  "성공! 다음 손가락: " +
                  FINGER_NAMES[TARGET_SEQUENCE[currentSeqIndex]];

                statusBox.style.color = "#10b981";
                updateDashboard();

                setTimeout(() => {
                  isCooldown = false;
                }, 350);
              } else if (!isCooldown) {
                for (const tipIndex of TARGET_SEQUENCE) {
                  if (tipIndex === targetTipIndex) continue;

                  const wrongFinger = landmarks[tipIndex];

                  const wrongDist = Math.hypot(
                    thumb.x - wrongFinger.x,
                    thumb.y - wrongFinger.y
                  );

                  if (wrongDist < 0.045 && !isCooldown) {
                    isCooldown = true;
                    totalErrors++;

                    statusBox.innerText =
                      "순서 오류! 현재 목표: " +
                      FINGER_NAMES[targetTipIndex];

                    statusBox.style.color = "#ef4444";
                    updateDashboard();

                    setTimeout(() => {
                      isCooldown = false;
                    }, 350);
                  }
                }
              }
            }
          }
        }

        canvasCtx.restore();
      }

      const hands = new Hands({
        locateFile: function (file) {
          return "https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/" + file;
        }
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 0,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      hands.onResults(onResults);

      const camera = new Camera(videoElement, {
        onFrame: async function () {
          await hands.send({ image: videoElement });
        },
        width: 640,
        height: 480,
        facingMode: "user"
      });

      camera
        .start()
        .then(function () {
          cameraReady = true;
          startBtn.disabled = false;
          startBtn.innerText = "패러다임 시작";
          statusBox.innerText = "카메라 연결 완료. 손을 화면에 올려보세요.";
          statusBox.style.color = "#10b981";
        })
        .catch(function (err) {
          console.error(err);
          cameraReady = false;
          startBtn.disabled = true;
          startBtn.innerText = "카메라 오류";

          statusBox.innerText =
            "카메라 실행 실패.\nHTTPS 주소인지, 카메라 권한을 허용했는지 확인하세요.";
          statusBox.style.color = "#ef4444";
        });
    });
  </script>
</body>
</html>
